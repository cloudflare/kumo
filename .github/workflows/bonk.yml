name: Bonk

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  # intentionally hardcoded so that all Bonk workflows coexist peacefully
  group: bonk-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  bonk:
    if: |
      github.event.sender.type != 'Bot' &&
      (contains(github.event.comment.body || github.event.review.body, '/bonk') || contains(github.event.comment.body || github.event.review.body, '@ask-bonk'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check author has repository write access
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_AUTHOR: ${{ github.event.comment.user.login || github.event.review.user.login }}
        run: |
          PERMISSION=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$REQUEST_AUTHOR/permission" --jq .permission)
          case "$PERMISSION" in
            admin|maintain|write) ;;
            *) echo "::error::Author must have repository write access"; exit 1 ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Bonk
        uses: ask-bonk/ask-bonk/github@5d4fe8f4a557afb1b73ec8c0ffcf60359a28865f # main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_AI_GATEWAY_ACCOUNT_ID }}
          CLOUDFLARE_GATEWAY_ID: ${{ secrets.CF_AI_GATEWAY_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_AI_GATEWAY_TOKEN }}
          # Auto-approve tool calls in CI only, so Bonk doesn't get stuck on
          # approval prompts.
          OPENCODE_CONFIG_CONTENT: '{"permission":{"*":"allow","question":"deny","doom_loop":"deny"}}'
        with:
          oidc_base_url: https://ask-bonk.cloudflare-exponent.workers.dev/auth
          model: "cloudflare-ai-gateway/openai/gpt-5.6-terra"
          variant: "high"
          agent: kumo
          mentions: "/bonk,@ask-bonk"
          opencode_dev: true
          opencode_version: "latest"
          permissions: write
