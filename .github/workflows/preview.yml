name: Preview

on:
  pull_request:
  # Also trigger on push to PR branches (for bots that push via API)
  push:
    branches:
      - "opencode/**"
      - "changeset-release/main"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pkg-preview:
    name: Package Preview
    if: ${{ github.repository_owner == 'cloudflare' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies
        with:
          filter: "@cloudflare/kumo..."

      - uses: ./.github/actions/vite-task-cache
      - name: Build @cloudflare/kumo
        run: vp run build:kumo

      - name: Publish preview package
        run: vp dlx pkg-pr-new publish --pnpm --compact --no-template ./packages/kumo

  # Worker Builds handles internal branches. Fork branches are not present in
  # the connected repository, so build an artifact for the privileged
  # preview-deploy.yml workflow to deploy.
  docs-build:
    name: Docs Build
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies
        with:
          filter: "@cloudflare/kumo-docs-astro..."

      - uses: ./.github/actions/vite-task-cache
      # build:docs builds kumo first (task dependency).
      - name: Build docs
        run: vp run build:docs

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview-dist
          path: packages/kumo-docs-astro/dist/
          include-hidden-files: true
          retention-days: 1
