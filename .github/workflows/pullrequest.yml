name: Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths-ignore:
      - "*.md"
      - ".changeset/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changeset:
    timeout-minutes: 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-dependencies
      - name: Test changeset validation
        run: vp exec tsx --test ci/utils/git-operations.test.ts
      - run: vp exec tsx ci/scripts/validate-kumo-changeset.ts
        env:
          NO_CHANGESET_REQUIRED: ${{ contains(github.event.pull_request.labels.*.name, 'no-changeset-required') }}

  build:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ./.github/actions/install-dependencies
      - uses: ./.github/actions/vite-task-cache
      - run: vp run build:kumo
      - uses: actions/upload-artifact@v4
        with:
          name: kumo-dist
          path: packages/kumo/dist
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: kumo-ai
          path: packages/kumo/ai
          retention-days: 1

  format:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ./.github/actions/install-dependencies
      - run: vp run format:check

  lint:
    needs: build
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ./.github/actions/install-dependencies
      - uses: actions/download-artifact@v4
        with:
          name: kumo-dist
          path: packages/kumo/dist
      - uses: actions/download-artifact@v4
        with:
          name: kumo-ai
          path: packages/kumo/ai
      - uses: ./.github/actions/vite-task-cache
      # kumo-figma imports generated JSON data; type-aware lint needs it
      - run: vp run gen:figma-data
      - run: vp run --filter @cloudflare/kumo lint:oxlint
      - run: vp lint packages/*/src

  typecheck:
    needs: build
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ./.github/actions/install-dependencies
      - uses: actions/download-artifact@v4
        with:
          name: kumo-dist
          path: packages/kumo/dist
      - uses: actions/download-artifact@v4
        with:
          name: kumo-ai
          path: packages/kumo/ai
      - run: vp run typecheck

  test:
    needs: build
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ./.github/actions/install-dependencies
      - uses: actions/download-artifact@v4
        with:
          name: kumo-dist
          path: packages/kumo/dist
      - uses: actions/download-artifact@v4
        with:
          name: kumo-ai
          path: packages/kumo/ai
      - run: vp run --filter @cloudflare/kumo test

  test-react-compatibility:
    needs: build
    timeout-minutes: 5
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - react-version: "18.3.1"
            types-react-version: "18.3.12"
            types-react-dom-version: "18.3.1"
          - react-version: "19.2.0"
            types-react-version: "19.2.4"
            types-react-dom-version: "19.2.3"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ./.github/actions/install-dependencies
      - name: Install React ${{ matrix.react-version }} test dependencies
        run: |
          npm pkg set \
            "pnpm.overrides.react=${{ matrix.react-version }}" \
            "pnpm.overrides.react-dom=${{ matrix.react-version }}" \
            "pnpm.overrides.@types/react=${{ matrix.types-react-version }}" \
            "pnpm.overrides.@types/react-dom=${{ matrix.types-react-dom-version }}"
          vp install --no-frozen-lockfile --ignore-scripts --filter "@cloudflare/kumo..."
      - uses: actions/download-artifact@v4
        with:
          name: kumo-dist
          path: packages/kumo/dist
      - uses: actions/download-artifact@v4
        with:
          name: kumo-ai
          path: packages/kumo/ai
      - name: Verify React test versions
        run: |
          cd packages/kumo
          node -e "if (require('react/package.json').version !== '${{ matrix.react-version }}') process.exit(1)"
          node -e "if (require('react-dom/package.json').version !== '${{ matrix.react-version }}') process.exit(1)"
      - run: vp run --filter @cloudflare/kumo typecheck
      - run: vp run --filter @cloudflare/kumo test
