name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      id-token: write
      contents: write
      pull-requests: write

    if: ${{ github.repository_owner == 'cloudflare' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Build @cloudflare/kumo
        run: vp run --filter @cloudflare/kumo build

      # changesets/action either:
      # 1. Creates/updates a "Version Packages" PR (when changesets exist)
      # 2. Publishes to npm via `vp run release` (when Version Packages PR merges)
      # Note: `vp run release` runs `pnpm build:all && changeset publish`,
      # which rebuilds kumo (redundant but harmless). If this becomes slow,
      # consider a publish-only script.
      - name: Create Version PR or Publish to npm
        id: changesets
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1
        with:
          version: vp run version
          publish: vp run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          # Changesets shells out to npm for registry lookups. Allow that npm
          # subprocess even though Vite+ configures pnpm as the package manager.
          NPM_CONFIG_FORCE: true

      # Publish pkg-pr-new preview for Version Packages PR
      # (GITHUB_TOKEN PRs don't trigger workflows, so we do it here)
      - name: Publish package preview
        if: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: vp dlx pkg-pr-new publish --pnpm --compact --no-template ./packages/kumo

  # Publishes every main commit to npm under the `beta` dist-tag
  # (e.g. 2.15.0-beta.3d93312). Lives in this file because npm trusted
  # publishing is bound to release.yml.
  beta:
    permissions:
      id-token: write
      contents: read

    if: ${{ github.repository_owner == 'cloudflare' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      # Applies pending changesets, then appends -beta.<sha> to bumped versions.
      # With no pending changesets (e.g. the Version Packages merge), the
      # version is unchanged and there is nothing new to publish.
      - name: Version beta
        id: version
        run: |
          vp run version:beta
          version=$(node -p "require('./packages/kumo/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-beta.* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "No pending changesets; skipping beta publish of $version"
          fi

      - name: Build @cloudflare/kumo
        if: ${{ steps.version.outputs.publish == 'true' }}
        run: vp run --filter @cloudflare/kumo build

      - name: Publish beta to npm
        if: ${{ steps.version.outputs.publish == 'true' }}
        run: vp run release:beta
        env:
          NPM_CONFIG_PROVENANCE: true
          # See the release job: lets changesets shell out to npm.
          NPM_CONFIG_FORCE: true

      - name: Summary
        if: ${{ steps.version.outputs.publish == 'true' }}
        run: |
          {
            echo "### Published @cloudflare/kumo@${{ steps.version.outputs.version }}"
            echo '```sh'
            echo "pnpm add @cloudflare/kumo@beta"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
